name: ASKC CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Report dependency audit findings
        run: |
          npm audit --json --prefix frontend > /tmp/frontend-audit.json || true
          npm audit --json --prefix backend > /tmp/backend-audit.json || true
          node -e "for (const name of ['frontend','backend']) { const report = require('/tmp/' + name + '-audit.json'); console.log(name + ' audit:', JSON.stringify(report.metadata?.vulnerabilities || {})); for (const [pkg, item] of Object.entries(report.vulnerabilities || {})) { if (['high','critical'].includes(item.severity)) console.log(name, item.severity, pkg, 'direct=' + item.isDirect, 'fix=' + JSON.stringify(item.fixAvailable), 'via=' + item.via.map(v => typeof v === 'string' ? v : v.title).join('; ')); } }"
      - name: Check backend JavaScript syntax
        run: |
          node --check backend/routes/auth.js
          node --check backend/server.js
          node --check backend/controllers/authController.js
          node --check backend/models/Otp.js
          node --check backend/models/Subscription.js
      - name: Build frontend
        run: npm run build --prefix frontend
        env:
          CI: "false"
