name: Vite Migration Validation

on:
  push:
    branches: [vite-frontend-security-migration]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-build-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vite-frontend-security-migration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and refresh lockfiles
        run: |
          npm install --prefix frontend
          npm ci --prefix backend
      - name: Build and syntax validation
        run: |
          npm run build --prefix frontend
          node --check backend/server.js
          node --check backend/routes/auth.js
          node --check backend/controllers/authController.js
      - name: Report remaining dependency advisories
        run: |
          npm audit --json --prefix frontend > /tmp/frontend-audit.json || true
          npm audit --json --prefix backend > /tmp/backend-audit.json || true
          node -e "for (const n of ['frontend','backend']) { const a=require('/tmp/'+n+'-audit.json'); console.log(n, JSON.stringify(a.metadata?.vulnerabilities || {})); for (const [p,v] of Object.entries(a.vulnerabilities || {})) console.log(p, v.severity, 'direct='+v.isDirect, 'fix='+JSON.stringify(v.fixAvailable)); }"
      - name: Commit generated frontend lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then echo "Lockfile unchanged"; else git commit -m "chore(frontend): generate Vite dependency lockfile"; git push origin vite-frontend-security-migration; fi
