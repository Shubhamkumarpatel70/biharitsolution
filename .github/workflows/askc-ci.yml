name: ASKC Technologies CI

on:
  push:
    branches:
      - feat/askc-technologies-corporate-rebuild
  pull_request:
    branches:
      - main

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: Install project dependencies
        run: npm run install-all
      - name: Build React application
        run: npm run build
      - name: Check backend JavaScript syntax
        run: |
          node --check backend/server.js
          node --check backend/routes/cms.js
          node --check backend/routes/auth.js
          node --check backend/models/SiteContent.js
          node --check backend/models/AuditLog.js
          node --check backend/models/Contact.js
          node --check backend/routes/media.js
          node --check backend/models/Media.js
